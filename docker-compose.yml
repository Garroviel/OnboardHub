services:
  app:
    build: .
    container_name: onboardhub_app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://onboardhub:onboardhub@db:3306/onboardhub?serverVersion=mariadb-12.1.2&charset=utf8mb4"
    depends_on:
      - db

  db:
    image: mariadb:12.1
    container_name: onboardhub_db
    environment:
      MARIADB_DATABASE: onboardhub
      MARIADB_USER: onboardhub
      MARIADB_PASSWORD: onboardhub
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - onboardhub_db_data:/var/lib/mysql

volumes:
  onboardhub_db_data: